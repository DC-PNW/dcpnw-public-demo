plugins {
    id 'java'
}

group = 'com.example'
version = '1.0.0'
sourceCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    // Application dependencies
    implementation 'org.springframework:spring-core:6.2.19'
    implementation 'org.springframework:spring-web:6.2.18'
    implementation 'org.apache.struts:struts2-core:6.8.0'
    implementation 'commons-collections:commons-collections:3.2.2'
    implementation 'commons-beanutils:commons-beanutils:1.11.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    implementation 'org.apache.commons:commons-compress:1.26.0'
    implementation 'org.json:json:20231013'
    implementation 'mysql:mysql-connector-java:8.0.28'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.9'
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'org.jsoup:jsoup:1.15.3'

    // Test dependencies
    testImplementation 'junit:junit:4.13.1'
    testImplementation 'org.mockito:mockito-core:1.9.5'
    testImplementation 'org.seleniumhq.selenium:selenium-java:2.41.0'
    testImplementation 'org.powermock:powermock-api-mockito:1.5.1'
    testImplementation 'org.easymock:easymock:3.0'
    testImplementation 'org.testng:testng:6.1.1'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnit()
}
