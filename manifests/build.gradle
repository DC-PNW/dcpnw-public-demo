plugins {
    id 'java'
}

group = 'com.example'
version = '1.0.0'
sourceCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    // Application dependencies
    implementation 'org.springframework:spring-core:4.3.0.RELEASE'
    implementation 'org.springframework:spring-web:4.3.0.RELEASE'
    implementation 'org.apache.struts:struts2-core:2.3.1'
    implementation 'commons-collections:commons-collections:3.2.1'
    implementation 'commons-beanutils:commons-beanutils:1.8.3'
    implementation 'org.apache.logging.log4j:log4j-core:2.8.1'
    implementation 'org.apache.commons:commons-compress:1.10'
    implementation 'org.json:json:20140107'
    implementation 'mysql:mysql-connector-java:5.1.31'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.0'
    implementation 'org.apache.httpcomponents:httpclient:4.3.6'
    implementation 'org.jsoup:jsoup:1.7.2'

    // Test dependencies
    testImplementation 'junit:junit:4.8.2'
    testImplementation 'org.mockito:mockito-core:1.9.5'
    testImplementation 'org.seleniumhq.selenium:selenium-java:2.41.0'
    testImplementation 'org.powermock:powermock-api-mockito:1.5.1'
    testImplementation 'org.easymock:easymock:3.0'
    testImplementation 'org.testng:testng:6.1.1'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnit()
}
